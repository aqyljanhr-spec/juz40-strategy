<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#0f291c;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;min-width:0}body{min-height:100svh;background:#102D20}.hidden{display:none!important}

.shell::before{content:"";position:absolute;z-index:-1;right:-17vw;top:16%;width:48vw;aspect-ratio:1;border:1px solid #b4e9bd1c;border-radius:50%;box-shadow:0 0 0 9vw #b4e9bd08,0 0 0 19vw #b4e9bd05;pointer-events:none}
header,.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}header{min-height:38px}.brand{font-weight:900;letter-spacing:-.065em;font-size:clamp(19px,2vw,27px)}.brand span{color:#9FE7B2}.chapter{font-size:12px;font-weight:700;letter-spacing:.15em;color:#B6DFC0}.mode{padding:9px 15px;background:#ffffff14;border:1px solid #ffffff27;border-radius:40px;color:#D0EBD5;font-size:12px;font-weight:750}.slide{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:1420px;margin:0 auto;min-height:0}.eyebrow{text-transform:uppercase;letter-spacing:.24em;color:#A3DDB4;font-weight:750;font-size:clamp(11px,1.1vw,16px);margin:0 0 15px}.display{font-size:clamp(42px,6.8vw,110px);letter-spacing:-.063em;line-height:1.04;margin:0 0 22px;font-weight:840;max-width:1240px}.lead{font-size:clamp(18px,2.3vw,32px);line-height:1.4;color:#D6EBD9;margin:0;max-width:1080px}.smallLead{color:#B8DAC3;font-size:clamp(15px,1.5vw,21px);line-height:1.5}.footer{border-top:1px solid #a7dabb35;padding-top:17px;min-height:52px;color:#B6D3BD;font-size:clamp(12px,1.1vw,16px)}.footer-right{display:flex;align-items:center;gap:18px}.footer-clock{font-variant-numeric:tabular-nums;font-size:19px;font-weight:850;color:#F1FFF3}.footer-clock.danger{color:#FFD29C}.fullscreen{border:1px solid #89b69750;background:#ffffff11;color:#fff;border-radius:11px;padding:8px 12px;cursor:pointer;font:inherit;font-size:12px;font-weight:700}.fullscreen:hover{background:#ffffff20}
.green{color:#A5ECB9}.stat-line{display:flex;flex-wrap:wrap;gap:14px;margin-top:clamp(30px,6vh,60px)}.stat{border:1px solid #ffffff25;background:#ffffff0d;border-radius:16px;padding:18px 23px;min-width:145px}.stat .number{display:block;font-size:clamp(30px,3.5vw,52px);font-weight:830;letter-spacing:-.05em}.stat .hint{display:block;color:#BED8C5;font-size:13px;margin-top:6px}.cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.5vw,22px);margin-top:25px}.slidecard{border:1px solid #8cc59d35;border-radius:20px;padding:clamp(15px,2.2vw,31px);background:#ffffff0d;min-width:0}.slidecard strong{display:block;font-size:clamp(19px,2.1vw,31px);line-height:1.26}.slidecard p{margin:9px 0 0;color:#D3E7D7;line-height:1.48;font-size:clamp(14px,1.6vw,21px)}.cardno{display:inline-block;color:#9EE7B3;font-weight:900;margin-bottom:13px;font-size:13px;letter-spacing:.15em}.agenda{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:36px}.agenda .slidecard{min-height:200px;display:flex;flex-direction:column;justify-content:space-between}.agenda .cardno{font-size:21px}.timepill{background:#ffffff17;padding:7px 12px;display:inline-block;border-radius:30px;font-weight:700;color:#AEE9B9;font-size:14px}.instruction-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin-top:33px}.instruction-list .slidecard{min-height:190px}.instruction-list .cardno{font-size:22px}
.hero-clock{text-align:center;font-variant-numeric:tabular-nums;font-size:clamp(94px,19vw,280px);font-weight:820;line-height:1;letter-spacing:-.075em;margin:clamp(30px,5vh,55px) 0 19px}.centered{text-align:center;align-items:center}.centered .display{max-width:1100px}.centered .lead{margin:auto}.bar{height:9px;width:min(100%,1050px);border-radius:20px;background:#ffffff2c;overflow:hidden;margin:12px auto}.bar>div{height:100%;width:100%;background:linear-gradient(90deg,#67D795,#CCF5C5);transition:width .35s linear}.time-status{color:#D5F0DD;font-size:clamp(15px,1.5vw,21px);font-weight:650;text-align:center;margin:12px 0}.urgent .hero-clock,.urgent .footer-clock{color:#FFD998}.expired .hero-clock{color:#FFB1A7}
.groups-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:26px}.group-card{background:#ffffff10;border:1px solid #ffffff24;border-radius:18px;padding:clamp(12px,1.6vw,23px);min-height:140px}.group-name{font-weight:760;font-size:clamp(15px,1.45vw,20px);margin-bottom:14px;line-height:1.25}.group-values{font-size:clamp(20px,3vw,36px);font-variant-numeric:tabular-nums;font-weight:850}.group-help{color:#C1DEC8;font-size:12px;margin-top:7px}.smallbar{background:#ffffff23;height:6px;border-radius:15px;overflow:hidden;margin-top:10px}.smallbar>div{height:100%;background:#91DFAB;border-radius:15px}
.topic-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.group-pill{padding:9px 14px;background:#ffffff15;border:1px solid #ffffff33;border-radius:99px;font-size:clamp(13px,1.2vw,17px)}.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}.result-box{border:1px solid #ffffff30;background:#ffffff0e;border-radius:19px;padding:clamp(16px,2vw,27px);min-width:0}.result-box small{color:#9FE3B5;font-weight:750;letter-spacing:.06em}.result-box p{font-size:clamp(16px,1.65vw,24px);line-height:1.42;overflow-wrap:anywhere;white-space:pre-wrap}.result-box .answer{color:#CBE1D1;border-top:1px solid #ffffff25;padding-top:13px;margin-top:15px;font-size:clamp(13px,1.15vw,16px)}.result-box.answer-only{grid-column:1/-1}.result-grid.vision{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px}.vision-title{color:#9FE9B8;font-size:clamp(16px,1.65vw,22px);font-weight:850;letter-spacing:.01em;margin:19px 0 9px}.vision .result-box{min-height:135px}.vision .result-box p{font-size:clamp(14px,1.4vw,21px)}.vision .result-box small{font-size:12px}
.podium{height:clamp(250px,45vh,400px);display:flex;justify-content:center;align-items:flex-end;gap:clamp(9px,2vw,33px);margin:clamp(20px,4vh,50px) 0 0}.winner{width:min(29%,300px);display:flex;flex-direction:column;align-items:stretch;text-align:center;justify-content:flex-end;opacity:0;animation:riseup .8s ease forwards}.winner.p3{animation-delay:.3s}.winner.p2{animation-delay:1.8s}.winner.p1{animation-delay:3.3s}.winner strong{font-size:clamp(14px,1.45vw,20px);margin-bottom:7px;overflow-wrap:anywhere}.winner .vote-num{font-size:13px;color:#C4E4CF;margin-bottom:12px}.step{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:13px 13px 0 0;background:#3A7651;box-shadow:inset 0 3px #ffffff25}.step .rank{font-size:clamp(44px,6vw,88px);font-weight:900;line-height:1}.step .medal{font-size:clamp(22px,3vw,35px);margin-bottom:5px}.p1 .step{height:clamp(165px,28vh,245px);background:#AC853E}.p2 .step{height:clamp(128px,23vh,190px);background:#718C91}.p3 .step{height:clamp(95px,17vh,150px);background:#966A4D}@keyframes riseup{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}.fireworks{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:11}.fireworks i{position:absolute;left:var(--x);top:var(--y);width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 15px var(--c);opacity:0;animation:firework 1.7s ease-out var(--delay) forwards}@keyframes firework{0%{transform:translate(0,0) scale(.2);opacity:0}15%{opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:10}.confetti span{position:absolute;top:-10%;left:var(--x);background:var(--c);width:8px;height:17px;border-radius:2px;opacity:0;animation:fall var(--t) linear var(--d) forwards}@keyframes fall{0%{transform:translate(0,-30px) rotate(0);opacity:0}5%{opacity:1}100%{transform:translate(var(--dx),115vh) rotate(850deg);opacity:0}}
.notice{background:#ffffff13;border:1px solid #ffffff26;border-radius:18px;padding:22px 25px;color:#D8EDE0;font-size:clamp(15px,1.7vw,23px);line-height:1.5;margin-top:20px}.error{color:#FFD9AA}.subtitle{font-size:clamp(18px,2.2vw,30px);color:#CDE6D3}.rule{display:block;margin-top:26px;width:85px;height:6px;background:#91E5AF;border-radius:99px}

.shell[data-screen="vision"],.shell[data-screen="results"],.shell[data-screen="progress"]{padding-top:clamp(14px,2vw,26px);padding-bottom:clamp(12px,1.4vw,22px);gap:12px;max-height:100svh;height:100svh}
.shell[data-screen="vision"] .slide,.shell[data-screen="results"] .slide,.shell[data-screen="progress"] .slide{justify-content:flex-start;overflow-y:auto;scrollbar-width:thin}
.shell[data-screen="vision"] .display,.shell[data-screen="progress"] .display,.shell[data-screen="results"] .display{font-size:clamp(35px,4.5vw,67px);margin-bottom:10px}
.shell[data-screen="vision"] .lead,.shell[data-screen="progress"] .lead,.shell[data-screen="results"] .lead{font-size:clamp(16px,1.7vw,24px)}
.shell[data-screen="vision"] .eyebrow,.shell[data-screen="progress"] .eyebrow,.shell[data-screen="results"] .eyebrow{margin-bottom:9px}
.shell[data-screen="vision"] .vision-title{margin:12px 0 7px}
.shell[data-screen="vision"] .result-box{padding:16px 19px;min-height:100px}
.shell[data-screen="vision"] .result-box p{margin:10px 0;font-size:clamp(14px,1.35vw,19px)}
.shell[data-screen="vision"] .result-grid{gap:12px}
@media(max-width:1020px){.agenda{grid-template-columns:repeat(2,minmax(0,1fr))}.groups-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.agenda .slidecard{min-height:150px}}
@media(max-width:650px){.shell{padding:21px 17px;gap:18px}.slide{justify-content:center}.display{font-size:clamp(34px,8vw,53px)}.stat{min-width:115px;padding:12px 15px}.cardgrid,.instruction-list{grid-template-columns:1fr}.instruction-list .slidecard{min-height:unset}.agenda .slidecard{min-height:135px}.result-grid,.result-grid.vision{grid-template-columns:1fr;max-height:65svh;overflow:auto}.groups-grid{max-height:65svh;overflow:auto}.group-card{min-height:125px}.podium{height:280px}.winner strong{font-size:12px}.winner .vote-num{font-size:11px}.footer{gap:8px}.chapter{display:none}}
@media(prefers-reduced-motion:reduce){.winner{opacity:1;animation:none}.confetti{display:none}.bar>div{transition:none}}

.shell:not([data-screen="work"]) #footerClock{display:none}
</style></head><body>
<div class="shell" id="shell"><header><div class="brand">P<span>&</span>I <span>STRATEGY</span></div><span class="chapter" id="chapter">STRATEGY SESSION · LIVE STAGE</span><span class="mode" id="modeLabel">ЖҮКТЕЛУДЕ…</span></header>
<main class="slide" id="slide" aria-live="polite"><p class="eyebrow">P&I STRATEGY SESSION</p><h1 class="display">Презентация жүктелуде…</h1></main>
<footer class="footer"><span id="footInfo">7 топ · 76 қатысушы</span><div class="footer-right"><strong class="footer-clock" id="footerClock">--:--</strong><button class="fullscreen" id="fullScreen">⛶ Толық экран</button></div></footer><div class="confetti hidden" id="confetti"></div><div class="fireworks hidden" id="fireworks"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),mode=new URLSearchParams(location.search).get('mode')==='live'?'live':'test';
$('modeLabel').textContent=mode.toUpperCase()+' · LIVE STAGE';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slides=['welcome','agenda','instruction','work','progress','results','vision','awards','closing'];
const stages={issues:{name:'Жеке мәселелерді жазу',instructions:['Өз бөліміңіздегі маңызды мәселелерді ойластырыңыз','Әр мәселені нақты, түсінікті тұжырымдаңыз','Ұсыныстарыңызды жүйеге енгізіңіз']},vote:{name:'Мәселелерге дауыс беру',instructions:['Топ мүшелерінің ұсыныстарын оқыңыз','Ең маңызды 3 мәселені таңдаңыз','Дауыс беру аяқталғанша таңдауыңызды тексеріңіз']},solutions:{name:'ТОП-3 шешімдер',instructions:['ТОП-3 мәселені бірге талқылаңыз','Әр мәселе үшін нақты шешім ұсыныңыз','Капитан шешімдерді жүйеге енгізіп, бекітеді']},vision:{name:'Vision · 1 / 3 / 5 жыл',instructions:['Бөлімнің 1, 3, 5 жылдық болашағын елестетіңіз','JUZ40 компаниясының даму бағытын анықтаңыз','Капитан топтың ортақ көзқарасын бекітеді']},changes:{name:'Қосу / Өзгерту / Алып тастау',instructions:['Жаңа енгізу керек процестерді анықтаңыз','Қолданыстағы жұмыстарды жеңілдету жолын талқылаңыз','Тиімсіз процестерді алып тастау ұсыныстарын беріңіз']},risks:{name:'ҰБТ өзгерістері мен тәуекелдер',instructions:['ҰБТ-дағы ықтимал өзгерістерді анықтаңыз','Әр өзгерістің тәуекелін бағалаңыз','Алдын алу немесе бейімделу шараларын ұсыныңыз']},awards:{name:'Ең белсенділерге дауыс беру',instructions:['Басқа топтың ең белсенді қатысушысын таңдаңыз','Өз тобыңыздың ең белсенді қатысушысын таңдаңыз','Екі номинация бойынша дауысыңызды сақтаңыз']}};
let publicData=null,privateData=null,timeOffset=0,fetching=false,lastSlide=null,lastAwardShown=false;
function timeLeft(){let s=publicData?.stage;if(!s)return 0;return s.running?Math.max(0,Number(s.deadline_ms||0)-(Date.now()+timeOffset)):Math.max(0,Number(s.remaining_ms||0))}
function stamp(ms){let t=Math.ceil(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function tick(){let n=timeLeft();$('footerClock').textContent=stamp(n);$('shell').classList.toggle('urgent',n<=60000&&n>0&&publicData?.stage?.running);$('shell').classList.toggle('expired',n<=0&&!!publicData);let clock=$('mainClock');if(clock)clock.textContent=stamp(n);let bar=$('mainBar');if(bar)bar.style.width=Math.max(0,Math.min(100,100*n/Math.max(1,Number(publicData?.stage?.duration_ms||1))))+'%';let status=$('clockStatus');if(status)status.textContent=publicData?.stage?.running?(n>0?'Таймер жүріп жатыр':'Уақыт аяқталды'):(n===0?'Уақыт аяқталды':n===Number(publicData?.stage?.duration_ms)?'Басталуын күтуде':'Пауза')}
function stageText(){return stages[publicData?.stage?.stage_id]||stages.issues}
function hero(title,lead,eyebrow='P&I · STRATEGY SESSION'){return `<p class="eyebrow">${esc(eyebrow)}</p><h1 class="display">${title}</h1><p class="lead">${lead}</p>`}
function groupCards(data){return (data||[]).map(g=>{const current=publicData?.stage?.stage_id;let numerator=current==='issues'?g.issues:current==='vote'?g.voted:current==='solutions'?g.done:current==='vision'?g.done:current==='changes'?g.done:current==='risks'?g.done:g.joined;let den=current==='issues'||current==='vote'?g.total:current==='solutions'||current==='vision'||current==='changes'||current==='risks'?4:g.total;return `<div class="group-card"><div class="group-name">${esc(g.name)}</div><div class="group-values">${numerator}<span class="smallLead">/${den}</span></div><div class="group-help">${['issues','vote'].includes(current)?'Қатысушы орындады':current==='awards'?'Сессияға қосылды':'Аяқталған блок саны'} · Онлайн: ${g.online}</div><div class="smallbar"><div style="width:${Math.round(100*numerator/Math.max(1,den))}%"></div></div></div>`}).join('')}
function resultBlock(d){if(!d)return '<div class="notice error">Super Admin ретінде кіріңіз. Нәтижелер осы қорғалған экранда ғана көрсетіледі.</div>';if(!d.results_ready)return '<div class="notice">Бұл топтың таңдаулы блогы әлі бекітілмеген. Нәтижелерді жариялау үшін алдымен блокты аяқтаңыз.</div>';if(!d.results?.length)return '<div class="notice">Жауаптар әлі енгізілмеген.</div>';return `<div class="result-grid">${d.results.map((r,i)=>`<div class="result-box ${d.results.length===1?'answer-only':''}"><small>${esc(r.label)}</small><p>${esc(r.text||'Жауап жоқ')}</p>${r.answer?`<div class="answer"><strong>ШЕШІМ</strong><p>${esc(r.answer)}</p></div>`:''}</div>`).join('')}</div>`}
function visionSection(d,key,title){return `<div class="vision-title">${title}</div><div class="result-grid vision">${d[key].map((v,i)=>`<div class="result-box"><small>${[1,3,5][i]} ЖЫЛДАН КЕЙІН</small><p>${esc(v||'Жауап жоқ')}</p></div>`).join('')}</div>`}
function podium(d){let top=d.awards.top||[];const person=i=>top[i]||{name:'—',group:'',votes:0};const winners=[[1,'p2',2,'🥈'],[0,'p1',1,'🥇'],[2,'p3',3,'🥉']];return `<div class="podium">${winners.map(([i,cls,rank,medal])=>{let p=person(i);return `<div class="winner ${cls}"><strong>${esc(p.name)}</strong><span class="vote-num">${esc(p.group)} · ${p.votes} дауыс</span><div class="step"><div class="medal">${medal}</div><div class="rank">${rank}</div></div></div>`}).join('')}</div>`}
function render(){if(!publicData)return;let s=publicData.stage,screen=s.screen||'work',info=stageText(),d=privateData,focus=d?.focus_group||s.focus_group||'Топ таңдалмаған';$('chapter').textContent=`${String(slides.indexOf(screen)+1).padStart(2,'0')} / 09 · P&I STRATEGY SESSION`;
$('shell').dataset.screen=screen;let view='';if(screen==='welcome')view=hero('P&I <span class="green">STRATEGY</span><br>SESSION','Әдістеме · Сапа · IT<br>Ортақ шешімдер. Нақты бағыт. Бір команда.','JUZ40 · PRODUCT & IT')+`<div class="stat-line"><div class="stat"><span class="number">76</span><span class="hint">қатысушы</span></div><div class="stat"><span class="number">7</span><span class="hint">топ</span></div><div class="stat"><span class="number">4</span><span class="hint">стратегиялық блок</span></div></div>`;
else if(screen==='agenda'){
 const p=s.presets||{};let mins=n=>n+' мин';view=hero('Бүгінгі <span class="green">бағдарлама</span>','Төрт стратегиялық блок және қорытынды марапаттау.');view+=`<div class="agenda">${[['01','Қазіргі жағдай','Мәселе → дауыс → ТОП-3',Number(p.issues||10)+Number(p.vote||5)+Number(p.solutions||15)],['02','Vision','1 / 3 / 5 жыл',p.vision||20],['03','Қосу / Өзгерту / Алып тастау','Процестер мен автоматтандыру',p.changes||15],['04','ҰБТ өзгерістері','Тәуекел және әрекет жоспары',p.risks||15]].map(a=>`<div class="slidecard"><div><span class="cardno">БЛОК ${a[0]}</span><strong>${a[1]}</strong><p>${a[2]}</p></div><div><span class="timepill">${mins(a[3])}</span></div></div>`).join('')}</div><p class="smallLead" style="margin-top:20px">Марапаттау дауысы · ${p.awards||5} мин. Уақыттар әкімші пультінде өзгертіледі.</p>`}
else if(screen==='instruction'){view=hero(esc(info.name),esc(publicData.task),'КЕЗЕҢ НҰСҚАУЛЫҒЫ');view+=`<div class="instruction-list">${info.instructions.map((x,i)=>`<div class="slidecard"><span class="cardno">0${i+1}</span><strong>${esc(x)}</strong></div>`).join('')}</div>`}

else if(screen==='results'){const labels=['Қазіргі жағдай · ТОП-3','Vision','Қосу / Өзгерту / Алып тастау','ҰБТ өзгерістері мен тәуекелдер'];view=hero(esc(labels[d?.focus_block??s.focus_block??0]),esc(focus),'ТОПТЫҢ БЕКІТІЛГЕН НӘТИЖЕСІ');view+=d?.focus_block===1?'<div class="notice">Vision жауаптарын толық көрсету үшін «Vision презентациясы» бетін таңдаңыз.</div>':resultBlock(d)}
else if(screen==='vision'){view=hero('Vision <span class="green">2027–2029–2031</span>',esc(focus),'БӨЛІМ МЕН КОМПАНИЯНЫҢ БОЛАШАҒЫ');view+=!d?'<div class="notice error">Super Admin ретінде кіріңіз.</div>':!d.vision?'<div class="notice">Бұл топтың Vision блогы әлі бекітілмеген.</div>':visionSection(d.vision,'department','БӨЛІМНІҢ БОЛАШАҒЫ')+visionSection(d.vision,'company','JUZ40 КОМПАНИЯСЫНЫҢ БОЛАШАҒЫ')+(d.vision.publisher!==null?`<div class="vision-title">JUZ40 БАСПАСЫНЫҢ БОЛАШАҒЫ</div><div class="result-box"><p>${esc(d.vision.publisher||'Жауап жоқ')}</p></div>`:'')}

function launchConfetti(){let layer=$('confetti');layer.replaceChildren();let colors=['#FFF3A4','#B8F2C7','#E4CBFF','#FFB8A0','#8CD6EF'];for(let i=0;i<105;i++){let elt=document.createElement('span');elt.style.setProperty('--x',(Math.random()*100)+'%');elt.style.setProperty('--c',colors[i%colors.length]);elt.style.setProperty('--t',(3+Math.random()*3)+'s');elt.style.setProperty('--d',(3.7+Math.random()*2)+'s');elt.style.setProperty('--dx',((Math.random()-.5)*170)+'px');layer.appendChild(elt)}layer.classList.remove('hidden')}
async function refresh(){if(fetching)return;fetching=true;try{const r=await fetch('/api/stage/'+mode,{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error('Stage API '+r.status);publicData=await r.json();timeOffset=publicData.server_now_ms-Date.now();try{const pr=await fetch('/api/presentation/'+mode,{cache:'no-store',credentials:'same-origin'});privateData=pr.ok?await pr.json():null}catch(e){privateData=null}render()}catch(e){if(!publicData){$('slide').innerHTML='<p class="eyebrow">БАЙЛАНЫС</p><h1 class="display">Серверге қосылу күтілуде…</h1><p class="lead">Қосылым қалпына келгенде презентация жалғасады.</p>'}}finally{fetching=false}}
$('fullScreen').onclick=()=>document.documentElement.requestFullscreen?.();refresh();setInterval(tick,250);setInterval(refresh,12000);let socket;function connect(){try{socket=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/api/live/'+mode);socket.onmessage=()=>refresh();socket.onclose=()=>setTimeout(connect,4500)}catch(e){}}connect();document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
